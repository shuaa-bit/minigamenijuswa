<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Minesweeper ni Juswa
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="script.js" defer></script>

          <h1 id="title">
              💣Minesweeper of Doom💣
          </h1>

<div class="game-info">
    <span>Mines:</span><span id="mine-count">10</span>
    <span>Time:</span><span id="timer">0</span>
</div>

<div id="game-board"></div>

<button id="start-btn">START</button>
<button id="restart-btn">RESTART</button>


<div id="death-overlay" class="hidden">
    <div class="media-container">
        <!-- 🔴 THE BYPASS FIX: adding muted and playsinline allows instant auto-play -->
        <video id="death-video" width="100%" height="100%" preload="auto" muted playsinline>
            <source src="LALA.mp3">
            Your browser does not support the video tag.
        </video>
        <button id="close-overlay-btn">Try Again</button>
    </div>
</div>

</body>
</html>
