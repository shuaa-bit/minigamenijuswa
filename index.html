<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper ni Juswa</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1 id="title">💣Minesweeper of Doom💣</h1>

    <div class="game-info">
        <span>Mines:</span><span id="mine-count">10</span>
        <span>Time:</span><span id="timer">0</span>
    </div>

    <div id="game-board"></div>

    <div class="controls-row">
        <button id="start-btn">START</button>
        <button id="restart-btn">RESTART</button>
    </div>

    <!-- DEATH SCREEN MEDIA OVERLAY -->
    <div id="death-overlay" class="hidden">
        <div class="media-container">
            <!-- 🎥 Video handles visual frame renders (forced mute) -->
            <video id="death-video" preload="auto" muted playsinline>
                <source src="shesh.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <!-- 🎵 Dedicated audio node plays the actual sound effect file -->
            <audio id="isaprank" preload="auto">
                <source src="LALA.mp3" type="audio/mpeg">
            </audio>
            
            <button id="close-overlay-btn">Try Again</button>
        </div>
    </div>

</body>
</html>
